<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1114">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>홀덤 토너먼트 승률·액션 계산기 (근사)</title>
<style>
:root{color-scheme:dark;--bg:#0f1114;--panel:#181b20;--panel2:#22262d;--ink:#eceff3;--sub:#9aa4b1;--line:#2c3139;--acc:#5ab966;--acc-ink:#0b0d10;--good:#5ab966;--bad:#ff6b6b;--warn:#f2c14e;--hl:90,185,102;--chip:#262a31;--fold:#3f7cc0;--call:#5ab966;--raise1:#e46464;--raise2:#cf4a4a;--raise3:#b33a3a;--allin:#7d1d1d;--red:#ff6b6b}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Malgun Gothic",sans-serif}
main{max-width:1500px;margin:0 auto;padding:8px 12px 60px}
h1{font-size:.95rem;margin:2px 0 8px;color:var(--sub);font-weight:600}
h2{font-size:1rem;margin:0 0 8px}
h3{font-size:.95rem;margin:12px 0 6px;color:var(--sub)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label.f{display:flex;flex-direction:column;font-size:.8rem;color:var(--sub);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px;min-height:40px}
input[type=number]{width:96px}
button{font:inherit;min-height:40px;min-width:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.18)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button.danger{color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{outline:2px solid var(--acc)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--chip);border:1px solid var(--line);margin-right:4px}
.badge.approx{color:var(--warn);border-color:var(--warn)}
.sub{color:var(--sub);font-size:.85rem}
.help{color:var(--sub);font-size:.85rem;margin:-4px 0 10px}
.err{color:var(--bad);font-weight:600}
/* 상단 액션 라인 */
.topbar>button{white-space:nowrap;flex:none}
.topbar{display:flex;gap:6px;overflow-x:auto;padding:6px;background:#15171b;border:1px solid var(--line);border-radius:10px;align-items:stretch;scrollbar-width:thin}
.pc{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;white-space:nowrap;font-weight:700;min-height:44px}
.pc .pp{color:var(--sub)}
.pc .pa{background:#363b45;border-radius:6px;padding:5px 10px;font-weight:600;min-width:56px;text-align:center}
.pc.fold .pa{color:#c9d6e6}
.pc.agg .pa{background:#5a2020;color:#ffd7d7}
.pc.pass .pa{background:#1f4a2a;color:#d6f5dc}
.pc.cur{border:2px solid var(--acc)}
.pc.cur .pa{background:transparent;color:var(--acc)}
.pc.hero .pp{color:var(--acc)}
.pc.out{opacity:.55}
.pc.info .pa{background:transparent;color:var(--sub);min-width:0;padding:0}
/* 카드/스트리트 줄 */
.brow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:8px 0}
.brow .stabs{margin-left:0}
.grp{display:flex;gap:4px;align-items:center}
.grp .lbl{font-size:.75rem;color:var(--sub);margin-right:2px;writing-mode:horizontal-tb}
.slot{min-width:42px;width:42px;height:54px;padding:0;border:2px dashed var(--line);border-radius:6px;background:var(--panel2);font-weight:700;color:var(--sub);font-size:.7rem}
.slot.active{border-color:var(--acc);border-style:solid}
.cardface,.cardface:disabled{background:#f4f4f4;border:1px solid #9a9a9a;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:clamp(.72rem,2.6vw,.95rem)}
.slot.cardface{background:#f4f4f4;border:1px solid #9a9a9a;font-size:.95rem}
.slot.cardface.active{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.su0{color:#000!important}.su1{color:#d40000!important}.su2{color:#0050d8!important}.su3{color:#0a8a2e!important}
.mini{display:inline-flex;align-items:center;padding:1px 5px;border-radius:4px;background:#f4f4f4;font-weight:800;font-size:.9rem;line-height:1.3}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.stabs .st{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:96px;padding:4px 10px}
.stabs .st.on{outline:0;border-color:var(--acc);background:#1d2a20}
.stabs small{font-size:.68rem;color:var(--sub);line-height:1.2}
.deckwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.deck{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;max-width:780px}
.deck button{padding:0;min-width:0;min-height:44px}
.deck button.cardface:disabled{opacity:.22}
/* 액션 입력 줄 */
.arow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.hint{font-weight:700;margin-bottom:4px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.abtn{display:flex;align-items:center;gap:8px;border-width:2px;font-weight:700}
.abtn i{display:inline-block;width:12px;height:12px;border-radius:3px}
.abtn small{color:var(--sub);font-weight:600}
.log{color:var(--sub);font-size:.85rem;margin-top:4px}
details>summary{cursor:pointer;font-weight:600;min-height:30px;color:var(--sub)}
/* 본문 2열 */
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:start}
@media(max-width:960px){.main{grid-template-columns:1fr}}
.ltabs{display:flex;gap:2px;margin:-4px 0 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.ltabs button{border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--sub);font-weight:700;white-space:nowrap}
.ltabs button.on{outline:0;color:var(--ink);background:var(--panel2)}
.sg{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px;background:#0b0c0e;border:1px solid #0b0c0e}
.sc{aspect-ratio:1.2;min-height:0;min-width:0;padding:2px 3px;border:0;border-radius:0;display:flex;align-items:flex-start;justify-content:flex-start;color:#fff;font-weight:600;font-size:clamp(8px,1.15vw,15px);text-shadow:0 1px 2px #000b;overflow:hidden;background:#2a2e35}
.sc:hover{filter:brightness(1.2)}
.sc.sel{outline:2px solid #fff;outline-offset:-2px;position:relative;z-index:1}
.sc.me{box-shadow:inset 0 0 0 3px #ffd54f}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.empty{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub);gap:10px}
/* 오른쪽 */
.posrow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.mp{background:var(--panel2);border-radius:6px;padding:4px 8px;text-align:center;font-weight:700;line-height:1.2;min-width:52px}
.mp small{display:block;color:var(--sub);font-weight:600}
.mp.out{opacity:.35}.mp.hero{color:var(--acc)}
.potinfo{margin-left:auto;text-align:right;font-weight:700}
.potinfo small{color:var(--sub);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin:10px 0 6px}
.tile{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;min-height:112px;padding:10px;border:0;border-radius:6px;color:#fff;text-align:left;text-shadow:0 1px 2px #0006}
.tile .tl{font-size:1.05rem;font-weight:700}
.tile .tf{font-size:1.9rem;font-weight:800;line-height:1}
.tile .tc{font-size:.72rem;opacity:.92;text-align:right}
.tile.on{outline:3px solid #fff;outline-offset:-3px}
.tile.dim{opacity:.45}
.sbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.sbar i{display:block;height:100%}
.htabs{display:flex;gap:4px;margin:12px 0 6px}
.hands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hand{background:var(--panel2);border-radius:6px;padding:8px;position:relative;overflow:hidden}
.hand .cc{display:flex;gap:3px;margin-bottom:6px;align-items:center}
.hand .hb{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:6px}
.hand .hb i{display:block;height:100%}
.hrow{display:flex;justify-content:space-between;gap:6px;font-size:.88rem}
.hand.me{outline:2px solid #ffd54f}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
/* 표/차트/기타 */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:8px 0}
.sum div{background:var(--panel2);border-radius:8px;padding:8px;font-size:.85rem;color:var(--sub)}
.sum b{display:block;font-size:1.1rem;color:var(--ink)}
.rec{border:2px solid var(--acc);border-radius:10px;padding:10px 12px;margin:8px 0}
.rec b{font-size:1.15rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th[title]{text-decoration:underline dotted;cursor:help}
tr.main{cursor:pointer}
tr.top td{background:rgba(var(--hl),.12);font-weight:700}
tr.det td{white-space:normal;text-align:left;background:var(--panel2);font-size:.85rem}
.pos{color:var(--good)}.neg{color:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.charts svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-size:11px}
svg .ax{stroke:var(--line)}
svg .sb{fill:var(--sub)}
.rg{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;max-width:520px}
.rg div,.rg button{aspect-ratio:1;min-height:0;min-width:0;padding:0;border:0;border-radius:2px;font-size:clamp(7px,1.6vw,11px);display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--ink);overflow:hidden}
.vsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ok{color:var(--good)}.fail{color:var(--bad)}
ul.tight{margin:6px 0;padding-left:20px}
.expl p{margin:4px 0}
.stacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.stk{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px}
.stk input{width:100%}
.stk.out{opacity:.7}
.drawer{display:grid;gap:0}
/* 상단: 포지션별 액션 열 */
.tinfo{display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:150px;flex:none}
.tinfo b{font-size:.95rem}.tinfo span{color:var(--sub);font-size:.8rem}
.pcol{flex:none;min-width:118px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.pcol .ph{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;color:var(--sub);margin-bottom:2px}
.pcol .ph input{width:68px;min-height:28px;padding:2px 6px;text-align:right;font-weight:700}
.pcol .ph input:disabled{opacity:.5}
.pcol .left{font-size:.72rem;color:var(--sub);text-align:right;margin:-2px 0 2px}
.pbtns{display:flex;gap:4px;margin:2px 0 4px}
.mb{min-height:26px;min-width:0;padding:1px 7px;font-size:.74rem;border-radius:5px}
.mb.on{outline:1px solid var(--acc);color:var(--acc)}
.tinfo{min-width:178px}
.topzone{display:grid;grid-template-columns:minmax(330px,500px) minmax(0,1fr);gap:8px;align-items:start}
@media(max-width:900px){.topzone{grid-template-columns:1fr}}
.tbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tset{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--sub);padding-bottom:6px;border-bottom:1px solid var(--line)}
.tset label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.tset select,.tset input[type=number],.tset input[type=text]{min-height:30px;padding:2px 6px;font-size:.85rem}
.tset input[type=number]{width:72px}
.tset input[type=checkbox]{min-height:0}
.colzone{display:flex;flex-direction:column;gap:6px;min-width:0}
.cstrip{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 4px}
.pchip.cur{border:2px solid var(--acc)}
.pchip.out{opacity:.55}
.pcopen{display:flex;align-items:center;gap:6px;min-height:32px;padding:2px 8px;border:0;background:transparent;font-size:.82rem}
.pcopen b{color:var(--sub)}.pcopen span{font-weight:700}.pcopen em{font-style:normal;color:var(--sub);background:#333944;border-radius:4px;padding:1px 6px}
.pchip.cur .pcopen em{color:var(--acc);background:transparent;font-weight:700}
.pcopen i{font-style:normal;color:var(--sub)}
.stag{position:absolute;display:flex;gap:3px;z-index:4;white-space:nowrap}
.stag button{min-height:24px;min-width:0;padding:1px 7px;font-size:.72rem;font-weight:700;border-radius:5px;border:1px solid var(--line);background:#2b3039;color:var(--sub)}
.stag.cur .topen{border-color:var(--acc);color:var(--acc);background:#1d2a20}
.stag .tq{background:#2c3a4d;color:#c9d6e6;border-color:#3f7cc0}
.stag .topen.on{color:var(--ink);border-color:var(--ink)}
.stag.out{opacity:.6}
.ptable{margin-top:60px!important}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pgrid.q{gap:4px;margin:2px 0 4px}
.pgrid.q .mb{width:100%}
.cexp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.cexp .pcol{min-width:0}
.cexp .pcol.hero{grid-column:span 2}
@media(max-width:420px){.cexp .pcol.hero{grid-column:1/-1}}
button.seat{padding:0;min-width:0;min-height:0;cursor:pointer;font:inherit;font-size:.72rem;font-weight:700}
button.seat:hover{border-color:var(--acc);filter:brightness(1.2)}
.plist.wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:6px}
.tinfo .tr{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--sub)}
.tinfo select,.tinfo input[type=number]{min-height:30px;padding:2px 6px;width:84px}
.tinfo input[type=checkbox]{min-height:0}
.pcol.hero .ph span:first-child{color:var(--acc)}
.pcol.cur{border:2px solid var(--acc)}
.pcol.out{opacity:.5}
.pl{display:block;width:100%;text-align:left;min-height:24px;padding:2px 6px;border:0;border-radius:4px;background:transparent;color:var(--sub);font-size:.88rem;font-weight:600;line-height:1.3}
.pl.sel{background:#3a3f49;color:var(--ink)}
.pl.go{color:var(--ink);cursor:pointer;min-height:28px}
.pl.go:hover{background:#333944}
.pl small{float:right;color:var(--sub);font-weight:600;margin-left:6px}
.pl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.cin{display:flex;gap:4px;margin-top:4px;align-items:center}
.cin input{flex:1 1 40px;width:40px;min-width:0;min-height:30px;padding:2px 6px;font-weight:700}
.cin button{min-height:30px;padding:2px 8px;font-size:.78rem;white-space:nowrap;flex:none}
.cin span{font-size:.72rem;color:var(--sub)}
/* 오른쪽 탭 */
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 10px}
.rtabs button{border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--sub);font-weight:700}
.rtabs button.on{outline:0;color:var(--ink);background:var(--panel2)}
/* 테이블 뷰 */
.twrap{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:start}
.twrap>div:first-child{min-width:0}
@media(max-width:560px){.twrap{grid-template-columns:1fr}}
.ptable{position:relative;aspect-ratio:1.75;margin:14px 18px}
.ptable .felt{position:absolute;inset:6% 4%;border:3px solid #3a404a;border-radius:999px;background:radial-gradient(ellipse at center,#20252c 0%,#171a1f 70%)}
.seat{position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#262b33;border:2px solid #3a404a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--sub);line-height:1.15;text-align:center;z-index:2}
.seat b{color:var(--ink);font-size:.78rem}
.seat.hero{border-color:var(--acc);box-shadow:0 0 0 3px #5ab96633}
.seat.cur{border-color:var(--warn)}
.seat.out{opacity:.35}
.chip{position:absolute;transform:translate(-50%,-50%);font-size:.75rem;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:4px}
.chip i{width:9px;height:9px;border-radius:50%;background:#4fa3e8;display:inline-block}
.chip.big i{background:#f2c14e}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;color:#000;font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:3}
.pcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:1.05rem}
.ptop{text-align:center;font-weight:800;font-size:1.05rem;margin-top:2px}
.ptop small{color:var(--sub);font-weight:600;font-size:.78rem;margin-left:6px}
.ptable{margin:14px 18px 78px}
.bslots{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;gap:4px;align-items:center;z-index:2}
.bslots .gap{width:6px}
.tslot{width:38px;min-width:0;height:52px;min-height:0;padding:0;border:2px dashed #4a515c;border-radius:6px;background:#1d2127;color:var(--sub);font-size:.62rem;font-weight:700;line-height:1.1}
.tslot.cardface{border:1px solid #9a9a9a;background:#f4f4f4;font-size:.92rem}
.tslot.active{border-color:var(--acc);border-style:solid;box-shadow:0 0 0 2px var(--acc)}
.tslot.lock{opacity:.35}
.hcards{position:absolute;transform:translateX(-50%);display:flex;gap:4px;z-index:3}
.hcards .tslot{width:42px;height:58px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:2px solid var(--acc);padding:10px 12px 14px;max-height:62vh;overflow:auto;box-shadow:0 -8px 24px #000c}
.sheet .deck{margin:0 auto}

@media(max-width:560px){.ptable{aspect-ratio:1.25;margin:10px 10px 74px}.seat{width:50px;height:50px}.tslot{width:30px;height:42px;font-size:.55rem}.tslot.cardface{font-size:.78rem}.hcards .tslot{width:36px;height:50px}.ptop{font-size:.85rem}}
.pcenter small{display:block;color:var(--sub);font-weight:600;font-size:.75rem}
.pcenter .bd{display:flex;gap:2px;justify-content:center;margin-top:5px}
.plist{display:flex;flex-direction:column;gap:6px}
.pinfo{background:var(--panel2);border-radius:6px;padding:6px 8px;font-size:.8rem}
.pinfo .pt{display:flex;gap:6px;align-items:center;font-weight:700;margin-bottom:4px}
.pinfo .pt span{background:#333944;border-radius:4px;padding:0 5px;font-size:.7rem;color:var(--sub)}
.pinfo .pv{display:grid;grid-template-columns:1fr 1fr;gap:4px;color:var(--sub);font-size:.72rem}
.pinfo .pv b{display:block;color:var(--ink);font-size:.85rem}
</style>
</head>

<!-- ====================== 엔진 + 분석 (순수 JS, DOM 사용 금지 / Web Worker에서도 그대로 사용) ====================== -->
<script id="engine">
'use strict';
/* ---------- 카드 / 덱 / RNG ---------- */
const RANK_CH='23456789TJQKA', SUIT_CH='shdc', SUIT_SYM=['♠','♥','♦','♣'];
const cid=s=>{ if(typeof s!=='string'||s.length!==2) return -1; const r=RANK_CH.indexOf(s[0].toUpperCase()), u=SUIT_CH.indexOf(s[1].toLowerCase()); return (r<0||u<0)?-1:r*4+u; };
const cstr=i=>RANK_CH[i>>2]+SUIT_CH[i&3];
const rankOf=c=>c>>2, suitOf=c=>c&3;
const isValidCard=s=>cid(s)>=0;
function createDeck(){ const d=[]; for(let i=0;i<52;i++) d.push(i); return d; }
function parseCards(str){
  str=String(str).replace(/\s+/g,''); if(str.length%2) throw new Error('카드 표기 길이가 홀수예요: '+str);
  const out=[]; for(let i=0;i<str.length;i+=2){ const id=cid(str.substr(i,2)); if(id<0) throw new Error('잘못된 카드: '+str.substr(i,2)); if(out.includes(id)) throw new Error('중복된 카드: '+str.substr(i,2)); out.push(id); }
  return out;
}
function formatCard(i){ return (RANK_CH[i>>2]==='T'?'10':RANK_CH[i>>2])+SUIT_SYM[i&3]; }
function removeCards(deck,used){ const u=new Set(used); return deck.filter(c=>!u.has(c)); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- 핸드 평가 (3~7장, 점수가 클수록 강함) ---------- */
const _rc=new Int8Array(13), _sc=new Int8Array(4), _sm=new Int16Array(4), _k=new Int8Array(6);
const P=(c,a,b,d,e,f)=>((((c*13+(a>0?a:0))*13+(b>0?b:0))*13+(d>0?d:0))*13+(e>0?e:0))*13+(f>0?f:0);
function straightHigh(m){ for(let h=12;h>=4;h--){ if(((m>>(h-4))&31)===31) return h; } return ((m&0x100F)===0x100F)?3:-1; }
function fillKick(ex1,ex2,n){ let m=0; for(let r=12;r>=0&&m<n;r--){ if(_rc[r]>0&&r!==ex1&&r!==ex2) _k[m++]=r; } while(m<6) _k[m++]=-1; }
function evaluate(cs){
  _rc.fill(0); _sc.fill(0); _sm.fill(0);
  let mask=0;
  for(let i=0;i<cs.length;i++){ const c=cs[i], r=c>>2, s=c&3; _rc[r]++; _sc[s]++; _sm[s]|=1<<r; mask|=1<<r; }
  let fs=-1; for(let s=0;s<4;s++) if(_sc[s]>=5) fs=s;
  if(fs>=0){ const sh=straightHigh(_sm[fs]); if(sh>=0) return P(8,sh); }
  let q=-1,t1=-1,t2=-1,p1=-1,p2=-1;
  for(let r=12;r>=0;r--){ const n=_rc[r]; if(n===4) q=r; else if(n===3){ if(t1<0) t1=r; else if(t2<0) t2=r; } else if(n===2){ if(p1<0) p1=r; else if(p2<0) p2=r; } }
  if(q>=0){ fillKick(q,-1,1); return P(7,q,_k[0]); }
  if(t1>=0&&(t2>=0||p1>=0)){ const pr=t2>=0?(p1>t2?p1:t2):p1; return P(6,t1,pr); }
  if(fs>=0){ const sm=_sm[fs]; let m=0; for(let r=12;r>=0&&m<5;r--) if(sm&(1<<r)) _k[m++]=r; return P(5,_k[0],_k[1],_k[2],_k[3],_k[4]); }
  const sh=straightHigh(mask); if(sh>=0) return P(4,sh);
  if(t1>=0){ fillKick(t1,-1,2); return P(3,t1,_k[0],_k[1]); }
  if(p2>=0){ fillKick(p1,p2,1); return P(2,p1,p2,_k[0]); }
  if(p1>=0){ fillKick(p1,-1,3); return P(1,p1,_k[0],_k[1],_k[2]); }
  fillKick(-1,-1,5); return P(0,_k[0],_k[1],_k[2],_k[3],_k[4]);
}
const categoryOf=s=>Math.floor(s/371293);
const CAT_KO=['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'];
function handNameKo(s){ const c=categoryOf(s); return (c===8&&Math.floor((s-8*371293)/28561)===12)?'로열 플러시':CAT_KO[c]; }

/* ---------- 에퀴티 (전수 / 몬테카를로) ---------- */
function equityCalc(o){
  const hero=o.hero, board=o.board||[], rng=o.rng||mulberry32(1), N=o.samples||20000;
  if(!hero||hero.length!==2) throw new Error('히어로 핸드는 2장이어야 해요');
  if(![0,3,4,5].includes(board.length)) throw new Error('보드는 0, 3, 4, 5장이어야 해요');
  const dead=[...hero,...board]; if(new Set(dead).size!==dead.length) throw new Error('카드가 중복됐어요');
  if(!o.villains||!o.villains.length) throw new Error('상대가 없어요');
  const dset=new Set(dead);
  let V=o.villains.map((v,i)=>{ const f=v.filter(x=>x.w>0&&x.c[0]!==x.c[1]&&!dset.has(x.c[0])&&!dset.has(x.c[1])); if(!f.length&&!o.lenient) throw new Error('상대 '+(i+1)+'의 가능한 콤보가 없어요 (카드 중복 또는 빈 레인지)'); return f; });
  // lenient: 내 카드 때문에 가질 수 없는 상대는 제외 (블로커). 모두 제외되면 이기는 것으로 처리
  if(o.lenient){ V=V.filter(f=>f.length); if(!V.length) return {equity:1,win:1,tie:0,lose:0,samples:0,stderr:0,exact:true}; }
  const nV=V.length, missing=5-board.length;
  const arrs=[[hero[0],hero[1],0,0,0,0,0]]; for(let i=0;i<nV;i++) arrs.push([0,0,0,0,0,0,0]);
  for(let j=0;j<board.length;j++) for(const a of arrs) a[2+j]=board[j];
  let win=0,tie=0,lose=0,eq=0,sq=0,n=0;
  const scoreOnce=()=>{
    const hs=evaluate(arrs[0]); let max=-1,cnt=0;
    for(let i=1;i<=nV;i++){ const s=evaluate(arrs[i]); if(s>max){max=s;cnt=1;} else if(s===max) cnt++; }
    let sh; if(hs>max){sh=1;win++;} else if(hs<max){sh=0;lose++;} else {sh=1/(cnt+1);tie++;}
    eq+=sh; sq+=sh*sh; n++;
  };
  let exact=false;
  if(!o.forceMC && missing<=2 && V.every(v=>v.length===1)){
    const seen=new Set(dead); for(let i=0;i<nV;i++) for(const c of V[i][0].c){ if(seen.has(c)) throw new Error('카드가 중복됐어요'); seen.add(c); }
    for(let i=0;i<nV;i++){ arrs[i+1][0]=V[i][0].c[0]; arrs[i+1][1]=V[i][0].c[1]; }
    const rem=[]; for(let c=0;c<52;c++) if(!seen.has(c)) rem.push(c);
    const setB=(idx,c)=>{ for(const a of arrs) a[idx]=c; };
    if(missing===0) scoreOnce();
    else if(missing===1){ for(const c of rem){ setB(6,c); scoreOnce(); } }
    else { for(let i=0;i<rem.length;i++){ setB(5,rem[i]); for(let j=i+1;j<rem.length;j++){ setB(6,rem[j]); scoreOnce(); } } }
    exact=true;
  } else {
    const used=new Uint8Array(52); dead.forEach(c=>used[c]=1);
    const cum=V.map(v=>{ const a=new Float64Array(v.length); let t=0; v.forEach((x,i)=>{t+=x.w;a[i]=t;}); return a; });
    const pick=new Array(nV), drawn=[];
    for(let s=0;s<N;s++){
      let ok=true, np=0;
      for(let i=0;i<nV;i++){
        let ch=-1;
        for(let t=0;t<30;t++){ const r=rng()*cum[i][cum[i].length-1]; let lo=0,hi=cum[i].length-1; while(lo<hi){ const m=(lo+hi)>>1; if(cum[i][m]>r) hi=m; else lo=m+1; } const cc=V[i][lo].c; if(!used[cc[0]]&&!used[cc[1]]){ ch=lo; break; } }
        if(ch<0){ ok=false; break; }
        pick[i]=ch; const cc=V[i][ch].c; used[cc[0]]=1; used[cc[1]]=1; np++;
      }
      if(ok){
        drawn.length=0;
        for(let j=0;j<missing;j++){ let c; do{ c=(rng()*52)|0; }while(used[c]); used[c]=1; drawn.push(c); for(const a of arrs) a[2+board.length+j]=c; }
        for(let i=0;i<nV;i++){ arrs[i+1][0]=V[i][pick[i]].c[0]; arrs[i+1][1]=V[i][pick[i]].c[1]; }
        scoreOnce();
        for(const c of drawn) used[c]=0;
      }
      for(let i=0;i<np;i++){ const cc=V[i][pick[i]].c; used[cc[0]]=0; used[cc[1]]=0; }
      if(o.onProgress&&(s&2047)===2047) o.onProgress((s+1)/N);
    }
  }
  if(!n) throw new Error('계산 가능한 표본이 없어요');
  const mean=eq/n, variance=Math.max(0,sq/n-mean*mean);
  return {equity:mean,win:win/n,tie:tie/n,lose:lose/n,samples:n,stderr:exact?0:Math.sqrt(variance/n),exact};
}
const asCombo=h=>[{c:[h[0],h[1]],w:1}];

    if(b<=20){ const r=lookupRange('jam',['BB'],b); return {range:r.range,label:`${pos} (행동 전: 계속 레인지 근사)`,note:`${pos}: 아직 행동 전 → 올인 대응 근사 레인지`,fallback:r.fallback,unacted:true}; }

  }
  const last=mine[mine.length-1];
  if(last.raiseNo){
    if(last.allin||b<=10) return res(lookupRange('jam',[pos],b),'올인');
    if(last.raiseNo===1) return res(lookupRange('open',[pos],b),'오픈');
    if(last.raiseNo===2) return res(lookupRange('threebet_vs_open',[`${pos} vs ${opener}`,pos],b),'3벳');

function classifyCombo(c,board){

    if(r0===r1) tier=r0>top?(r0>=8?'strong':'medium'):'weak';

// 상대는 "히어로의 베팅 레인지 대비 에퀴티(e) × 실현계수"가 팟오즈를 넘는 콤보로만 계속한다

  id:'heuristic',

    const cfg=DATA.response, k=p.street==='preflop'?'preflop':'postflop';
    const need=Math.max(0,p.callAmt/Math.max(EPS,p.potAfterHero+p.callAmt)-cfg.callSlack[k])/(p.defMult||1);

function comboEqVsRange(c,hc,cum,board,rng,n){

  const v=[c[0],c[1],0,0,0,0,0], h=[0,0,0,0,0,0,0]; board.forEach((b,j)=>{v[2+j]=b;h[2+j]=b;});

    const x=hc[lo].c; if(used[x[0]]||used[x[1]]) continue; used[x[0]]=1; used[x[1]]=1; h[0]=x[0]; h[1]=x[1]; drawn.length=0;

/* ---------- 설명 문장 (규칙 기반 템플릿, 수치는 분석값만 사용) ---------- */
const KO={
  potOddsGood:(eq,need)=>`승률 ${pctS(eq)}, 콜에 필요한 승률 ${pctS(need)}라서 콜이 이득이에요`,
  potOddsBad:(eq,need)=>`승률 ${pctS(eq)}가 콜에 필요한 승률 ${pctS(need)}보다 낮아서 폴드가 더 나아요`,
  foldEq:(label,f)=>`상대가 약 ${pctS(f)} 폴드할 것으로 보여 ${label}의 EV가 가장 높아요`,
  value:(eq)=>`상대 콜 레인지 대비 승률 ${pctS(eq)}라서 크게 베팅할수록 이득이에요`,
  push:(bb)=>`${fmt(bb)}bb에서는 올인이 다른 선택보다 단순하고 EV가 높아요`,
  close:(d)=>`두 선택의 차이가 ${fmt(d)}bb로 작아 어느 쪽도 괜찮아요`,
  check:(eq)=>`체크로 팟을 지키면서 승률 ${pctS(eq)}를 그대로 실현하는 쪽이 유리해요`,

  else if(best.kind==='check'){ if(fin(a.heroEquityVsRange)) out.push(KO.check(a.heroEquityVsRange)); }

function equityView(r){

  sv+=`<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2"/><line x1="${L}" x2="${W-Rr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="#f2c14e" stroke-dasharray="4 3"/><text x="${W-Rr}" y="${Y(avg)-4}" text-anchor="end" style="fill:#f2c14e;font-size:10px">평균 ${(avg*100).toFixed(1)}%</text><text x="${L}" y="${H-8}" class="sb" style="font-size:9px">강한 핸드</text><text x="${W-Rr}" y="${H-8}" text-anchor="end" class="sb" style="font-size:9px">약한 핸드 (내 레인지 누적 비율 →)</text></svg>`;

  h+=`</tbody></table></div><p class="sub">EV가 +이면 이득, −이면 손해 (지금 폴드 = 0 기준). 줄을 누르면 상대 폴드/콜/레이즈 비율이 펼쳐져요.</p>`;
  h+=`<h3>그래프</h3><div class="charts">${chartFreq(res.actions)}${chartEV(res.actions)}${chartSize(res.actions)}${chartEquity()}</div>`;
  h+=`<h3>추천 이유</h3><div class="expl">${ex.map(t=>`<p>• ${esc(t)}</p>`).join('')}</div><ul class="tight sub">${res.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`;
  h+=`<details><summary>용어 풀이</summary><ul class="tight sub"><li><b>EV</b>: 그 액션을 했을 때 평균적으로 얻는 칩(bb)</li><li><b>필요 승률(팟오즈)</b>: 콜 금액 ÷ (팟 + 콜 금액)</li><li><b>카드 승률</b>: 끝까지 갔을 때 이길 확률</li><li><b>팟 획득 확률</b>: 상대 폴드 확률 + 콜당했을 때 이길 확률</li><li><b>레인지</b>: 상대가 이 상황에서 가질 법한 핸드 모음</li><li><b>콤보</b>: 무늬까지 구분한 핸드 1개 (AA=6, AKs=4, AKo=12)</li><li><b>IP/OOP</b>: 포스트플랍에 나중에(유리)/먼저(불리) 행동</li></ul></details>`;
  return h;
}

  <p class="sub">스몰블라인드 = 빅블라인드의 절반(${fmt(s.bbChips/2)}칩), 앤티 = 빅블라인드와 같은 금액(${s.anteOn?s.bbChips+'칩, BB 포지션이 냄':'사용 안 함'}).</p>
  <div class="stacks">${pos.map(p=>{ const hero=p===s.heroPos, f=!!s.folded[p]&&!hero; return `<div class="stk${f?' out':''}"><b>${p}${hero?' (나)':''}</b>${f?`<div style="min-height:40px;display:flex;align-items:center" class="sub">폴드 · 스택 입력 불필요</div>`:`<label class="f">스택(${s.unit==='bb'?'bb':'칩'})<input type="number" min="0" step="any" data-stack="${p}" value="${toUnit(s.stacks[p])}"></label>`}${hero?'<span class="sub">내 자리</span>':`<button data-fold="${p}" class="${f?'on':''}">${f?'폴드 취소':'폴드'}</button>`}</div>`; }).join('')}</div></section>`;

function secTools(){
  return `<section class="panel"><details><summary>레인지 확인기 (13×13 그리드, 편집 가능)</summary><p class="sub">표기 예: 22+, A2s+, KTo+, QJs, 76s:0.5 (":" 뒤는 가중치) · 편집 모드에서는 칸을 눌러 0 → 0.5 → 1 로 바꿔요.</p>
  <textarea id="toolText" style="width:100%" rows="2">${esc(ui.tool.text)}</textarea><div class="row"><label><input type="checkbox" id="toolEdit"${ui.tool.edit?' checked':''} style="min-height:0"> 편집 모드</label><span>범위 <b id="toolpct"></b></span><span class="err" id="toolerr"></span></div><div id="toolgrid"></div></details>
  <details><summary>계산 방식 안내 · 한계</summary><ul class="tight sub"><li><b>전략 격자</b>: 169개 핸드마다 액션별 EV를 계산해 소프트맥스로 빈도를 만든 근사치예요. GTO 솔버 결과가 아니에요.</li><li><b>내시 균형 (푸시/폴드)</b>: 유효 스택 20bb 이하에서 앞사람이 모두 폴드했거나 한 명이 올인한 상황은 올인/폴드 내시 균형을 직접 계산해요 (ICM 순위 점수 또는 칩EV, 콜러 1명 모델, 블로커 무시). 이때는 "내시 균형" 배지가 붙어요.</li><li><b>헤즈업 솔버 (CFR)</b>: 턴·리버에서 2명만 남으면 정해진 베팅 사이즈(리버 팟 50·100%+올인, 레이즈 1회 / 턴 66%+올인 → 리버 75%+올인) 안에서 균형을 직접 계산해요. 최대 약 8초, 균형 오차를 함께 표시해요. 플랍은 계산하지 않아요.</li><li><b>프리플랍 승률표</b>: 169×169 핸드 대 핸드 승률을 미리 계산해 내장했어요 (쌍당 50,000회).</li><li><b>상대 대응</b>: 상대 콤보마다 "내 액션 레인지 대비 승률 × 실현계수"가 팟오즈를 넘으면 계속, 아니면 폴드. 단, 최소 방어 빈도(MDF) 이상은 계속한다고 가정해요.</li><li><b>내 액션 레인지</b>: 상대가 보는 내 레인지는 이 격자가 그 액션에 배정한 핸드(상위 강도 순)로 몇 차례 맞춰 가요.</li><li><b>상대 레인지</b>: 프리플랍 액션 → 근사 레인지 데이터(JSON), 포스트플랍 → 핸드 강도별 가중치 축소 휴리스틱.</li><li><b>EV</b>: 칩EV(bb), 지금 폴드 = 0. 재레이즈 이후 트리는 단순화했고 ICM·사이드팟은 반영하지 않아요.</li><li><b>바꾸고 싶다면</b>: 이 파일의 JSON 블록 — 레인지 d-ranges, 사이즈 d-sizes, 상대 대응 d-response, 빈도 d-frequency, 좁히기 d-narrowing.</li></ul></details>
  <details><summary>자체 검증 (테스트 실행)</summary><div class="acts"><button data-act="selftest">검증 실행</button></div><div id="testout"></div></details></section>`;
}

const A=(street,position,type,toBB)=>({street,position,type,toBB});
const EXAMPLES=[
 {name:'BTN 오픈 대응 (BB)',make(){ const s=defaultStore(); s.heroPos='BB'; s.slots.h0='Ad'; s.slots.h1='Jc'; s.folded={UTG:true,HJ:true,CO:true}; s.actions=[A('preflop','BTN','raise',2.2),A('preflop','SB','fold')]; return s; }},
 {name:'3벳 팟 플랍 (c벳)',make(){ const s=defaultStore(); POSITIONS[6].forEach(p=>s.stacks[p]=100); s.folded={UTG:true,HJ:true}; s.slots={h0:'Ah',h1:'Qs',f0:'Kc',f1:'7d',f2:'2h',t:null,r:null}; s.street='flop'; s.actions=[A('preflop','CO','raise',2.5),A('preflop','BTN','raise',8),A('preflop','SB','fold'),A('preflop','BB','fold'),A('preflop','CO','call'),A('flop','CO','check')]; return s; }},
 {name:'짧은 스택 푸시 (10bb)',make(){ const s=defaultStore(); POSITIONS[6].forEach(p=>s.stacks[p]=10); s.folded={UTG:true,HJ:true,CO:true}; s.slots.h0='Ad'; s.slots.h1='9c'; return s; }}];
function loadStore(o){ store=Object.assign(defaultStore(),o); store.active=SLOT_KEYS.find(k=>!store.slots[k])||'h0'; ui.results={}; ui.error=''; ui.msg=''; ui.sel=null; ui.focus=null; ui.pick=false; ui.errKey=null; }
const b64u=u8=>{ let s=''; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u=t=>{ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const s=atob(t); return Uint8Array.from(s,c=>c.charCodeAt(0)); };
async function encodeState(){ const bytes=new TextEncoder().encode(serializeState(store)); try{ if(window.CompressionStream){ const cs=new CompressionStream('deflate-raw'), w=cs.writable.getWriter(); w.write(bytes); w.close(); return 'z'+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer())); } }catch(e){} return 'j'+b64u(bytes); }
async function decodeState(t){ let bytes=unb64u(t.slice(1)); if(t[0]==='z'){ const ds=new DecompressionStream('deflate-raw'), w=ds.writable.getWriter(); w.write(bytes); w.close(); bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer()); } return deserializeState(new TextDecoder().decode(bytes)); }
function getSaves(){ try{ return JSON.parse(localStorage.getItem('holdem-calc-saves')||'{}'); }catch(e){ return {}; } }
function putSaves(o){ try{ localStorage.setItem('holdem-calc-saves',JSON.stringify(o)); return true; }catch(e){ ui.saveMsg='브라우저 저장소를 쓸 수 없어요 (시크릿 모드/차단). "링크 복사"를 이용하세요.'; return false; } }

/* ---------- 이벤트 ---------- */
const app=$('app');
app.addEventListener('change',e=>{
  const t=e.target, f=t.dataset.f;
  if(t.dataset.stack){ store.stacks[t.dataset.stack]=Math.max(0.1,fromUnit(+t.value||0.1)); ui.results={}; }
  else if(f==='n') resetForN(+t.value);
  else if(f==='heroPos'){ ui.openCols=new Set(); store.heroPos=t.value; delete store.folded[t.value]; ui.results={}; }
  else if(f==='unit') store.unit=t.value;
  else if(f==='bbChips'){ const old=store.bbChips; store.bbChips=Math.max(1,+t.value||1); if(store.unit==='chips'){ for(const k in store.stacks) store.stacks[k]=store.stacks[k]*old/store.bbChips; } }
  else if(f==='anteOn'){ store.anteOn=t.checked; ui.results={}; }
  else if(f==='icmOn'){ store.icmOn=t.checked; ui.results={}; }
  else if(f==='entrants'){ store.entrants=+t.value; store.points=pointsForEntrants(store.entrants); ui.results={}; ui.msg=`참가 ${store.entrants}명 순위 점수: ${store.points.join(', ')}`; }
  else if(f==='points'){ const v=t.value.split(/[,\s]+/).filter(Boolean).map(Number); if(v.length>=store.n&&v.every(x=>isFinite(x))){ store.points=v.concat((store.points||[]).slice(v.length)); ui.msg=''; } else ui.msg=`순위 점수는 1등부터 ${store.n}등까지 ${store.n}개를 쉼표로 적어 주세요`; ui.results={}; }
  else if(t.id==='toolText'){ ui.tool.text=t.value; }
  else if(t.id==='toolEdit'){ ui.tool.edit=t.checked; }
  else return;
  render();
});
app.addEventListener('click',async e=>{
  const b=e.target.closest('button,tr.main'); if(!b||b.disabled) return; const d=b.dataset;
  if(d.slot){ if(store.slots[d.slot]&&store.active===d.slot&&ui.pick) store.slots[d.slot]=null; store.active=d.slot; ui.pick=true; ui.sel=null; }
  else if(d.card){ setCard(d.card); ui.sel=heroClassIdx(); }
  else if(d.fold){ const q=d.fold; if(store.folded[q]) delete store.folded[q]; else { store.folded[q]=true; store.actions=store.actions.filter(a=>a.position!==q); } ui.results={}; ui.msg=''; }
  else if(d.street){ store.street=d.street; ui.msg=''; ui.focus=null; }
  else if(d.do){ const spot=spotFromStore(), rp=replaySpot(spot,store.street); if(!rp.toAct) return; const sz=$('sz'); pushAction({street:store.street,position:rp.toAct,type:d.do,toBB:(d.do==='bet'||d.do==='raise')?+(sz&&sz.value):undefined}); }
  else if(d.preset){ const sz=$('sz'); if(sz) sz.value=d.preset; return; }
  else if(d.doto){ const rp=replaySpot(spotFromStore(),store.street); if(!rp.toAct) return; pushAction({street:store.street,position:rp.toAct,type:d.kind,toBB:+d.doto}); }
  else if(d.pick){ const r=ui.results[store.street]; if(!r) return; const x=r.range.cands.find(a=>a.key===d.pick); if(!x) return; pushAction({street:store.street,position:store.heroPos,type:x.kind,toBB:x.kind==='bet'||x.kind==='raise'?x.toBB:undefined}); ui.focus=null; }
  else if(d.cell!==undefined){ const i=+d.cell; ui.sel=ui.sel===i?null:i; }
  else if(d.focus){ ui.focus=ui.focus===d.focus?null:d.focus; }
  else if(d.colopen){ const q=d.colopen; ui.openCols.has(q)?ui.openCols.delete(q):ui.openCols.add(q); }
  else if(d.sethero){ ui.openCols=new Set(); store.heroPos=d.sethero; delete store.folded[d.sethero]; ui.results={}; ui.sel=null; ui.msg=''; const rp=replaySpot(spotFromStore(),'river'); if(rp.errors.length){ store.actions=[]; store.street='preflop'; ui.msg='내 자리를 바꿔서 액션 기록을 초기화했어요'; } }
  else if(d.tab){ ui.tab=d.tab; }
  else if(d.rtab){ ui.rtab=d.rtab; }
  else if(d.vsel!==undefined){ ui.vSel=+d.vsel; }
  else if(d.row){ ui.open.has(d.row)?ui.open.delete(d.row):ui.open.add(d.row); }
  else if(d.rg!==undefined&&e.target.closest('#toolgrid')){ try{ const w=parseRange(ui.tool.text), i=+d.rg; w[i]=w[i]===0?0.5:w[i]===0.5?1:0; ui.tool.text=formatRange(w); }catch(err){} }
  else if(d.ex){ loadStore(EXAMPLES[+d.ex].make()); ui.drawer=false; }
  else if(d.act==='customdo'){ const v=+($('csz')?.value), rp=replaySpot(spotFromStore(),store.street); if(!rp.toAct) return; if(!(v>0)){ ui.msg='금액(bb)을 입력하세요'; } else pushAction({street:store.street,position:rp.toAct,type:d.kind,toBB:Math.round(v*100)/100}); }
  else if(d.act==='addsize'){ const v=Math.round(+($('hsz')?.value)*10)/10; if(!(v>0)){ ui.msg='추가할 사이즈(bb)를 입력하세요'; } else { const ex=store.extraSizes=store.extraSizes||{}; const a=ex[store.street]=ex[store.street]||[]; if(!a.includes(v)) a.push(v); ui.msg=''; } }
  else if(d.addsz){ const v=+d.addsz, ex=store.extraSizes=store.extraSizes||{}, a=ex[store.street]=ex[store.street]||[]; if(!a.includes(v)) a.push(v); }
  else if(d.act==='clearsizes'){ if(store.extraSizes) delete store.extraSizes[store.street]; }
  else if(d.act==='drawer'){ ui.drawer=!ui.drawer; }
  else if(d.act==='pickdone'){ ui.pick=false; }
  else if(d.act==='clearcards'){ SLOT_KEYS.forEach(k=>store.slots[k]=null); store.active='h0'; ui.results={}; ui.sel=null; }
  else if(d.act==='undo'){ const a=store.actions.pop(); if(a) store.street=a.street; ui.msg=''; }
  else if(d.act==='resetstreet'){ store.actions=store.actions.filter(a=>a.street!==store.street); ui.msg=''; delete ui.results[store.street]; }
  else if(d.act==='analyze'){ ui.errKey=null; return runAnalysis(true); }
  else if(d.act==='save'){ const n=($('saveName').value||'').trim(); if(!n){ ui.saveMsg='저장 이름을 입력하세요'; } else { const s=getSaves(); s[n]=serializeState(store); if(putSaves(s)) ui.saveMsg=`'${n}' 저장했어요`; } }
  else if(d.act==='load'){ const n=$('loadSel').value; const s=getSaves(); if(n&&s[n]){ try{ loadStore(deserializeState(s[n])); ui.saveMsg=`'${n}' 불러왔어요`; }catch(err){ ui.saveMsg=err.message; } } }
  else if(d.act==='delsave'){ const n=$('loadSel').value; const s=getSaves(); if(n&&s[n]){ delete s[n]; putSaves(s); ui.saveMsg=`'${n}' 삭제했어요`; } }
  else if(d.act==='share'){ const t=await encodeState(); const url=location.href.split('#')[0]+'#s='+t; try{ history.replaceState(null,'','#s='+t); }catch(err){} try{ await navigator.clipboard.writeText(url); ui.saveMsg='링크를 복사했어요'; }catch(err){ ui.saveMsg='주소창의 링크를 복사하세요 (클립보드 권한 없음)'; } }
  else if(d.act==='selftest'){ $('testout').innerHTML='실행 중…'; const r=await runSelfTests(); $('testout').innerHTML=`<p>${r.filter(x=>x.pass).length}/${r.length} 통과${r.info?' · '+esc(r.info):''}</p><ul class="tight">${r.map(x=>`<li class="${x.pass?'ok':'fail'}">${x.pass?'✔':'✘'} ${esc(x.name)}${x.pass?'':' — '+esc(x.msg)}`).join('')}</ul>`; return; }
  else return;
  render();
});
app.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const id=e.target.id; if(id==='csz') e.target.closest('.cin')?.querySelector('[data-act=customdo]')?.click(); else if(id==='hsz') e.target.closest('.cin')?.querySelector('[data-act=addsize]')?.click(); });
app.addEventListener('input',e=>{ if(e.target.id==='toolText'){ ui.tool.text=e.target.value; try{ const w=parseRange(ui.tool.text); $('toolgrid').innerHTML=rangeGrid(w,{editable:ui.tool.edit}); $('toolpct').textContent=rangePercent(w).toFixed(1)+'%'; $('toolerr').textContent=''; }catch(err){ $('toolerr').textContent=err.message; } } });

(async()=>{
  const m=/#s=(.+)$/.exec(location.hash); if(m){ try{ loadStore(await decodeState(m[1])); ui.saveMsg='링크에서 상황을 불러왔어요'; }catch(e){ ui.saveMsg='링크를 읽을 수 없어요: '+e.message; } }
  render();
})();
// PWA: https(또는 localhost)에서 열면 오프라인 캐시 서비스 워커 등록 → 폰 "홈 화면에 추가"로 앱처럼 설치
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
